name: Build and Release AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build & Qt6 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools \
            file \
            desktop-file-utils \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libdbus-1-3 \
            libfontconfig1 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1

      - name: Run unit & integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Install PySide6-Essentials and PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "PySide6-Essentials>=6.7,<6.9" "pyinstaller>=6.10"

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Smoke-test built AppImage (CLI + headless Qt)
        run: |
          APPIMAGE_BIN="$(ls dist/appima-*.AppImage | head -n 1)"
          "${APPIMAGE_BIN}" --appimage-extract-and-run --version
          "${APPIMAGE_BIN}" --appimage-extract-and-run --help >/dev/null
          "${APPIMAGE_BIN}" --appimage-extract-and-run list
          sha256sum -c dist/SHA256SUMS --ignore-missing || (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appima-appimage-x86_64
          path: |
            dist/appima-*.AppImage
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/appima-*.AppImage
            dist/SHA256SUMS
